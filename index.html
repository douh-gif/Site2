<style>

.mu{color:var(--mu)}.hero{text-align:center;padding:24px 0}.logo svg{filter:drop-shadow(0 0 14px #2ee6a688)}

{t:'خريطة النمو',sp:'map'},

const filled=(p,k)=>(p.d[k]||'').trim();

return h('div',{},h('section',{class:'hero'},lg,h('h1',{},'نَمِّ فكرتك'),h('p',{class:'mu'},'من بذرة صغيرة إلى مشروع قابل للتطوير'),h('div',{class:'row c'},h('button',{class:'btn p',onclick:startNew},'لدي فكرة وأريد تطويرها'),h('button',{class:'btn g',onclick:()=>go('discover')},'أريد اكتشاف فكرة مناسبة لي'),h('button',{class:'btn',onclick:()=>document.getElementById('how').scrollIntoView({behavior:'smooth'})},'استكشف المنصة'))),

h('h2',{id:'how'},'كيف تعمل المنصة؟'),h('div',{class:'card'},h('ol',{},h('li',{},'أدخل فكرتك، أو أجب عن استبيان لاكتشاف فكرة.'),h('li',{},'أكمل المراحل؛ تُحفظ إجاباتك تلقائيًا في متصفحك.'),h('li',{},'راجع النواقص وأنشئ تقريرك وانسخه.')),h('p',{class:'mu'},'تنبيه: لا يوجد ذكاء اصطناعي ولا بحث في الإنترنت هنا؛ النواقص تُكتشف بقواعد مكتوبة، والأسئلة والإجابات جاهزة سلفًا، والمقترحات أفكار للاستكشاف وليست توصيات مضمونة.')))}

function vProj(){const w=h('div',{},h('h1',{},'مشاريعي'),h('div',{class:'card'},'💾 المشاريع محفوظة في هذا المتصفح فقط. هذا ليس نظام حسابات ولا مزامنة بين الأجهزة، وحذف بيانات المتصفح قد يمسح مشاريعك. صدّر نسخة احتياطية بين حين وآخر.'),h('button',{class:'btn p',onclick:startNew},'＋ مشروع جديد'));

w.append(h('h2',{},'استيراد مشروع'),ta,h('button',{class:'btn',onclick:()=>{try{const o=JSON.parse(ta.value);if(!o||typeof o.d!='object'||typeof o.name!='string')throw 0;const p=newP(o.d);p.name=String(o.name);['sim','asm','tasks'].forEach(k=>{if(Array.isArray(o[k]))p[k]=o[k]});save();toast('تم الاستيراد ✓');route()}catch(e){toast('البيانات غير صالحة',1)}}},'استيراد'));return w}

function vDev(){let p=cur();if(!p)p=newP();const i=p.s,s=S[i];p.vis[i]=1;auto();

const w=h('div',{},h('div',{class:'row'},h('b',{},'المرحلة '+(i+1)+' من 9: '+s.t),h('select',{'aria-label':'الانتقال إلى مرحلة',style:'width:auto;margin:0 auto 0 0',onchange:e=>go2(+e.target.value)},S.map((x,j)=>h('option',{value:j,selected:j==i},(j+1)+'. '+x.t)))),h('div',{class:'bar'},h('i',{style:'width:'+(i+1)/9*100+'%'})));
